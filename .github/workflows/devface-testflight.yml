name: DevFace → TestFlight

# Run from GitHub: Actions → "DevFace → TestFlight" → Run workflow.
# First time choose "setup", after that "beta" for every new build.
on:
  workflow_dispatch:
    inputs:
      lane:
        description: "setup = one-time signing setup, beta = build and upload to TestFlight"
        type: choice
        options: [beta, setup]
        default: beta

permissions:
  contents: write # fastlane match stores encrypted certificates on the match-certificates branch

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: DevFace
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install tools
        run: |
          brew install xcodegen
          gem install fastlane --no-document
          xcodebuild -showsdks | grep -q watchos || xcodebuild -downloadPlatform watchOS

      - name: fastlane ${{ inputs.lane }}
        run: fastlane ${{ inputs.lane }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
