# XcodeGen spec — run `xcodegen generate` in this folder to create DevFace.xcodeproj
# https://github.com/yonaskolb/XcodeGen
name: DevFace
options:
  bundleIdPrefix: com.vkalyoncu.devface
  deploymentTarget:
    watchOS: "10.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""   # set by fastlane on CI; pick your team here when using Xcode
    CODE_SIGN_STYLE: Automatic
targets:
  DevFace:
    type: application
    platform: watchOS
    sources: [DevFace]
    scheme: {}   # shared scheme, needed by xcodebuild on CI
    info:
      path: DevFace/Info.plist
      properties:
        CFBundleDisplayName: DevFace
        WKApplication: true
        WKWatchOnly: true
        WKSupportsAlwaysOnDisplay: true
        ITSAppUsesNonExemptEncryption: false   # skips the export-compliance question in TestFlight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vkalyoncu.devface.watchkitapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: DevFaceWidgets
  DevFaceWidgets:
    type: app-extension
    platform: watchOS
    sources: [DevFaceWidgets]
    info:
      path: DevFaceWidgets/Info.plist
      properties:
        CFBundleDisplayName: DevFace Widgets
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vkalyoncu.devface.watchkitapp.widgets
