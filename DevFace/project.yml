# XcodeGen spec — run `xcodegen generate` in this folder to create DevFace.xcodeproj
# https://github.com/yonaskolb/XcodeGen
#
# Layout matches Xcode's "Watch-only App" template: an invisible iOS container
# (the thing App Store Connect accepts) that carries the watchOS app, which in
# turn embeds the widget/complication extension.
#
#   DevFace (iOS container)        com.vkalyoncu.devface.watchkitapp      <- App Store Connect record
#   └─ DevFaceWatch (watchOS app)  com.vkalyoncu.devface.watchkitapp.watch
#      └─ DevFaceWidgets           com.vkalyoncu.devface.watchkitapp.watch.widgets
name: DevFace
options:
  bundleIdPrefix: com.vkalyoncu.devface
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""   # set by fastlane on CI; pick your team here when using Xcode
    CODE_SIGN_STYLE: Automatic
targets:
  DevFace:
    type: application.watchapp2-container
    platform: iOS
    scheme: {}   # shared scheme, needed by xcodebuild on CI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vkalyoncu.devface.watchkitapp
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: DevFace
    dependencies:
      - target: DevFaceWatch
        embed: true
        copy:
          destination: productsDirectory
          subpath: $(CONTENTS_FOLDER_PATH)/Watch
  DevFaceWatch:
    type: application
    platform: watchOS
    sources: [DevFace]
    info:
      path: DevFace/Info.plist
      properties:
        CFBundleDisplayName: DevFace
        WKApplication: true
        WKWatchOnly: true
        WKSupportsAlwaysOnDisplay: true
        ITSAppUsesNonExemptEncryption: false   # skips the export-compliance question in TestFlight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vkalyoncu.devface.watchkitapp.watch
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: DevFaceWidgets
  DevFaceWidgets:
    type: app-extension
    platform: watchOS
    sources: [DevFaceWidgets]
    info:
      path: DevFaceWidgets/Info.plist
      properties:
        CFBundleDisplayName: DevFace Widgets
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vkalyoncu.devface.watchkitapp.watch.widgets
